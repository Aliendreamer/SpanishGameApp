# pnpm 11+ reads its settings from here, not from package.json or .npmrc.
# minimumReleaseAge keeps its default (24 h): packages published less than a day ago are refused.
saveExact: true
savePrefix: ''
allowBuilds:
  # Both ship prebuilt binaries; their install scripts only build from source as a fallback.
  '@parcel/watcher': false
  unrs-resolver: false
