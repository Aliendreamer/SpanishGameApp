schema: spec-driven

context: |
  Android-only React Native app: Expo SDK 57, Expo Router, TypeScript (strict), pnpm.
  Tinder-style Spanish vocabulary swipe game, fully offline — no backend, no network at runtime.
  Layout: src/app routes only; src/screens, src/components, src/hooks, src/utils; tests colocated.
  Gates: pnpm check (typecheck, lint, format:check, test, check:pins, expo:doctor).
  Dependencies are pinned to exact versions. Roadmap and agreed decisions: openspec/ROADMAP.md.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Capture the design agreed during superpowers brainstorming; do not reopen settled decisions
  tasks:
    - Write each task test-first (failing test, then implementation)
    - Do not include commit steps; the user commits once the whole change is approved
